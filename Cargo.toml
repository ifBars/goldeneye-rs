[workspace]
members = ["crates/ge-assets", "crates/ge-core", "crates/ge-net", "crates/ge-net-transport", "crates/ge-render", "apps/goldeneye", "xtask"]
default-members = ["crates/ge-assets", "apps/goldeneye"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nod = "=1.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.18"
jpeg-decoder = { version = "=0.3.2", default-features = false }
cpal = { version = "=0.18.2", default-features = false }
wgpu = {version="=30.0.1",default-features=false,features=["std","parking_lot","dx12","vulkan","wgsl"]}
pollster = "0.4"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync"] }
bytes = "1"

[profile.release]
lto = "thin"
strip = true
